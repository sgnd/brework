name: Bug report
description: install.sh or a check did not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, and the error. Paste the last lines of the output.
      render: text
    validations:
      required: true
  - type: input
    id: brework
    attributes:
      label: brework version
      description: Run `git -C ~/.brework describe --tags --always` (or use the folder you installed from instead of `~/.brework`)
      placeholder: "v1.5.4"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Run `sw_vers -productVersion`
      placeholder: "15.5"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How did you install?
      options:
        - Everything
        - --cli-only
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Smoke test output (if you ran it)
      description: The FAIL lines from `~/.brework/scripts/smoke-test.sh` (or `scripts/smoke-test.sh` in the folder you installed from)
      render: text
