name: Bug report
description: install.sh or a check did not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, and the error. Paste the last lines of the output.
      render: text
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Run `sw_vers -productVersion`
      placeholder: "15.5"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How did you install?
      options:
        - Everything
        - --cli-only
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Smoke test output (if you ran it)
      description: The FAIL lines from `~/masbrew/scripts/smoke-test.sh`
      render: text
