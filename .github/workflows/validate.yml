name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC: catch packages removed or renamed upstream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brewfile:
    name: Brewfile packages exist (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel] # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/validate-brewfile.sh Brewfile

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh

  links:
    name: README links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Some sites answer 403/429 to bots even when the page exists, and a
          # few (gnu.org) are slow; only real errors such as 404 fail the job.
          args: --no-progress --accept 200..=299,403,429 --accept-timeouts --max-retries 3 README.md
          fail: true
