# Checks that run on GitHub after every push to main, every pull request, every release tag,
# and every Monday (to catch packages that were removed or disabled).
name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"] # a new release: the "Release version" check below
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  # 1. Every package in the Brewfile still exists.
  brewfile:
    name: Brewfile
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 20 # it usually takes a few minutes
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate-brewfile.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise looks up versions on GitHub (more requests with a token)

  # 2. The shell scripts and the GitHub workflows have no common bugs.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/*.sh
      - name: actionlint (checks the workflows, settings in .github/actionlint.yaml)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # 3. Every link (and #section link) in the docs still works.
  links:
    name: README links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Some websites block bots (403, 429) or answer slowly.
          # Only real errors, like 404 Not Found, fail this check.
          args: --no-progress --accept 200..=299,403,429 --accept-timeouts --max-retries 3 --include-fragments README.md docs/advanced.md CONTRIBUTING.md SECURITY.md
          fail: true

  # 4. Every install command in the docs names the release in install.sh (BREWORK_VERSION),
  #    and a pushed release tag is that release: install.sh refuses a tag whose install.sh names another one.
  release:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^BREWORK_VERSION="\([^"]*\)".*/\1/p' install.sh)"
          echo "BREWORK_VERSION in install.sh: ${version:-none}"
          [ -n "$version" ] || { echo "::error::install.sh has no BREWORK_VERSION line."; exit 1; }
          # An install command (or a git clone --branch) with another version. CHANGELOG.md keeps the old ones.
          stale="$(git grep -nE '(sgnd/brework/|--branch )v[0-9]+\.[0-9]+\.[0-9]+' -- ':!CHANGELOG.md' | grep -vF "$version" || true)"
          # A link to main is only for BREWORK_REF=main (see docs/advanced.md).
          main="$(git grep -n 'raw.githubusercontent.com/sgnd/brework/main/' | grep -v 'BREWORK_REF=main' || true)"
          if [ -n "$stale$main" ]; then
            printf '%s\n' "$stale" "$main" | sed '/^$/d'
            echo "::error::These lines must name $version, the version in install.sh (BREWORK_VERSION)."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$version" ]; then
            echo "::error::The tag $REF_NAME is not the version in install.sh ($version), so install.sh refuses it. Make a new tag on a commit where BREWORK_VERSION is the tag."
            exit 1
          fi
          echo "ok: every install command names $version"
