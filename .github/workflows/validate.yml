# Checks that run on GitHub after every push to main, every pull request,
# and every Monday (to catch packages that were removed or disabled).
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  # 1. Every package in the Brewfile still exists.
  brewfile:
    name: Brewfile
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 20 # it usually takes a few minutes
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate-brewfile.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise looks up versions on GitHub (more requests with a token)

  # 2. The shell scripts and the GitHub workflows have no common bugs.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/*.sh
      - name: actionlint (checks the workflows, settings in .github/actionlint.yaml)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # 3. Every link (and #section link) in the docs still works.
  links:
    name: README links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Some websites block bots (403, 429) or answer slowly.
          # Only real errors, like 404 Not Found, fail this check.
          args: --no-progress --accept 200..=299,403,429 --accept-timeouts --max-retries 3 --include-fragments README.md docs/advanced.md CONTRIBUTING.md SECURITY.md
          fail: true
