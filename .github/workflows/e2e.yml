# Runs install.sh for real on Apple Silicon Macs on GitHub,
# on macOS 15 (the oldest the README supports), 26 and 27: once with everything, and once with --cli-only.
# Not tested here: App Store apps, starting Docker, typing a password, the --remote-desktop apps,
# and the first download of the repo (it starts with the repo in ~/.brework, tagged as BREWORK_VERSION).
# The Macs run when a pull request changes a Brewfile, install.sh or smoke-test.sh,
# every Monday (a package or tool can break without any change here),
# and when you press "Run workflow" on GitHub.
# "End-to-end result" runs on every pull request and is a required check: it passes when
# the Macs passed, or when the pull request changes none of those files.
name: End-to-end

on:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # every Monday at 04:00 UTC, an hour after Validate
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo install=true >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qxE 'Brewfile|Brewfile\.apps|install\.sh|scripts/smoke-test\.sh|\.github/workflows/e2e\.yml'; then
            echo install=true >>"$GITHUB_OUTPUT"
          else
            echo "No Brewfile, install.sh, smoke-test.sh or e2e.yml change: the Macs are skipped."
            echo install=false >>"$GITHUB_OUTPUT"
          fi

  install:
    name: Install (${{ matrix.macos }}, ${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [everything, cli-only]
        macos: [macos-15, macos-26, macos-27]
        include:
          - macos: macos-15
            runner: macos-15 # Apple Silicon, the oldest macOS the README supports
          - macos: macos-26
            runner: macos-26 # Apple Silicon
          - macos: macos-27
            runner: xcode-27 # Apple Silicon, macOS 27 (GitHub calls it a preview, so it may wait in a queue)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7

      # 1. Make this Mac look like a new Mac.
      #    GitHub's Macs come with Homebrew and some apps. Remove them.
      - name: Remove Homebrew and apps from the list
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"
          sudo rm -rf "/Applications/Google Chrome.app" "/Applications/Visual Studio Code.app"
          rm -f ~/.zshenv ~/.zprofile ~/.zshrc ~/.bash_profile
          git config --global --unset core.pager || true

      # 2. Put this repo in ~/.brework, where `curl | bash` keeps it.
      #    App Store apps need a signed-in Apple ID, so leave them out of this test.
      #    install.sh moves ~/.brework to the tag in BREWORK_VERSION, from the copy's origin.
      #    Tag this pull request with that version here, so the test installs this pull request
      #    (through the same release check), not the release on GitHub.
      - name: Copy the repo to ~/.brework
        run: |
          git checkout -B e2e
          sed -i '' '/^mas /d' Brewfile.apps
          git -c user.name=e2e -c user.email=e2e@example.invalid commit --quiet -am "e2e: leave out the App Store apps"
          git tag -f "$(sed -n 's/^BREWORK_VERSION="\([^"]*\)".*/\1/p' install.sh)"
          git clone "$GITHUB_WORKSPACE" ~/.brework

      # 3. Run the installer from a pipe, like `curl ... | bash` does.
      - name: Run install.sh (like curl | bash)
        run: |
          if [ "$MODE" = cli-only ]; then
            cat ~/.brework/install.sh | bash -s -- --cli-only
          else
            cat ~/.brework/install.sh | bash
          fi
          # ~/.brework is now on the release tag, not on a branch.
          git -C ~/.brework describe --tags --exact-match
          if git -C ~/.brework symbolic-ref --quiet HEAD; then
            echo "Error: ~/.brework is still on a branch, not on the release tag."
            exit 1
          fi

      # 4. Run it again from the folder. It should not install anything new.
      - name: Run install.sh again (like ./install.sh)
        run: |
          if [ "$MODE" = cli-only ]; then
            ~/.brework/install.sh --cli-only
          else
            ~/.brework/install.sh
          fi

      # 5. Check everything in a new terminal (a clean zsh login shell, like on a new Mac).
      - name: Check the tools in a new terminal
        run: |
          # shellcheck disable=SC2016 # the new shell expands the $(...), not this one
          env -i HOME="$HOME" USER="$USER" MODE="$MODE" /bin/zsh -l -c '
            set -ex
            brew --version
            if [ "$MODE" = cli-only ]; then
              export HOMEBREW_BREWORK_CLI_ONLY=1
            fi
            # --no-upgrade: a version that came out after the install is not a failure
            brew bundle check --no-upgrade --verbose --file ~/.brework/Brewfile
            [ "$(command -v rsync)" = "$(brew --prefix)/bin/rsync" ]
            docker compose version
            docker buildx version
            command -v docker-credential-osxkeychain
            kubectl version --client
            copilot --version
            [ "$(git config --global core.pager)" = delta ]
            ls ~/Library/LaunchAgents/*colima*.plist
            if [ "$MODE" = cli-only ]; then
              [ -z "$(command -v mas)" ]
              [ ! -e "/Applications/Visual Studio Code.app" ]
            else
              mas version
              [ -e "/Applications/Visual Studio Code.app" ]
            fi
            # The remote desktop apps only come with --remote-desktop.
            [ -z "$(brew list --cask -1 | grep -xE "teamviewer|anydesk")" ]
          '

      # 6. The shell tools work in a new terminal, and running install.sh twice
      #    did not add their lines to ~/.zshrc, ~/.zshenv, ~/.zprofile and ~/.bash_profile twice.
      - name: Check the shell tools in a new terminal
        run: |
          cat ~/.zshrc ~/.zshenv ~/.zprofile ~/.bash_profile
          [ "$(grep -c "added by brework" ~/.zshrc)" -eq 4 ]
          for file in ~/.zshenv ~/.zprofile ~/.bash_profile; do
            [ "$(grep -c "brew shellenv" "$file")" -eq 1 ]
            [ "$(grep -c "mise activate .* --shims" "$file")" -eq 1 ]
          done
          env -i HOME="$HOME" USER="$USER" TERM=xterm /bin/zsh -l -i -c '
            set -e
            whence -w _mise_hook _direnv_hook __zoxide_z fzf-file-widget
          ' 2>&1 | tee shell.log
          ! grep -iE "error|not found|: none" shell.log # whence prints "NAME: none" for a missing hook

      # 7. Every tool does a small real job, and every command is found in a new terminal.
      - name: Smoke test (every tool really works)
        timeout-minutes: 15 # a hanging check fails fast instead of using the whole hour
        run: |
          # shellcheck disable=SC2016 # the new shell expands $MODE, not this one
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/zsh TERM=xterm-256color SKIP_DOCKER=1 MODE="$MODE" /bin/zsh -l -c '
            if [ "$MODE" = cli-only ]; then
              ~/.brework/scripts/smoke-test.sh --cli-only
            else
              ~/.brework/scripts/smoke-test.sh
            fi
          '

      # Not tested here: App Store apps (no Apple ID on GitHub's Macs)
      # and `colima start` (GitHub's Macs cannot start a VM inside their own VM).

  result:
    name: End-to-end result
    needs: [changes, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          INSTALL: ${{ needs.install.result }}
        run: |
          echo "Changed files: $CHANGES. Install on the Macs: $INSTALL."
          [ "$CHANGES" = success ] || { echo "Error: the changed-files check did not finish."; exit 1; }
          case "$INSTALL" in
            success | skipped) ;;
            *) echo "Error: the install on the Macs did not pass. Open the Install jobs above to see why."; exit 1 ;;
          esac
